<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Trail Finder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      height: 100vh; height: 100dvh;
      overflow: hidden;
    }

    .screen { display: none; flex-direction: column; height: 100vh; height: 100dvh; }
    .screen.active { display: flex; }

    /* ── Welcome ── */
    #screen-welcome {
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 40px;
      text-align: center;
    }
    #screen-welcome h1 { font-size: 2.5rem; font-weight: 700; letter-spacing: -1px; }
    #screen-welcome p.subtitle { color: #888; font-size: 1rem; max-width: 280px; line-height: 1.5; }
    #btn-start {
      background: #00e5ff; color: #000;
      border: none; border-radius: 32px;
      padding: 16px 40px; font-size: 1.1rem; font-weight: 700;
      cursor: pointer; margin-top: 16px;
    }
    #sensor-error { color: #ff5252; font-size: 0.85rem; display: none; }

    /* ── Recording ── */
    #screen-recording { position: relative; }
    #hud-recording {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px;
    }
    #rec-indicator { color: #ff5252; font-size: 0.85rem; font-weight: 600; }
    #step-count { color: #00e5ff; font-size: 0.85rem; }
    #map-canvas { width: 100%; flex: 1; display: block; }
    #btn-stop {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: #ff5252; color: #fff;
      border: none; border-radius: 32px;
      padding: 16px 40px; font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    #btn-stop:disabled { background: #444; color: #666; cursor: default; }
    #chart-canvas {
      position: absolute;
      bottom: 108px;
      right: 16px;
      width: 200px;
      height: 72px;
      border-radius: 8px;
      background: rgba(0,0,0,0.55);
      z-index: 10;
    }

    /* ── Handoff ── */
    #screen-handoff {
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 40px;
      text-align: center;
    }
    #screen-handoff h2 { font-size: 1.8rem; font-weight: 700; }
    #handoff-steps { color: #00e5ff; font-size: 1.1rem; }
    #screen-handoff p.instruction { color: #888; font-size: 1rem; max-width: 300px; line-height: 1.6; }
    #btn-find {
      background: #00e5ff; color: #000;
      border: none; border-radius: 32px;
      padding: 16px 40px; font-size: 1.1rem; font-weight: 700;
      cursor: pointer; margin-top: 8px;
    }

    /* ── Navigating ── */
    #screen-navigating { display: flex; flex-direction: column; position: relative; }
    #hud-nav {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: center; align-items: center;
      padding: 16px 20px;
    }
    #distance-display { color: #e0e0e0; font-size: 0.9rem; }
    #nav-canvas { width: 100%; flex: 1; display: block; }
  </style>
</head>
<body>

  <!-- Welcome -->
  <div id="screen-welcome" class="screen active">
    <h1>Trail Finder</h1>
    <p class="subtitle">Walk a path. Hand off the iPad. Let someone follow you.</p>
    <button type="button" id="btn-start">Start Recording</button>
    <p id="sensor-error">Please open on an iPad and allow motion access.</p>
  </div>

  <!-- Recording -->
  <div id="screen-recording" class="screen">
    <div id="hud-recording">
      <span id="rec-indicator">● REC</span>
      <span id="step-count">0 steps</span>
      <span id="debug-mag" style="color:#888;font-size:0.75rem"></span>
    </div>
    <canvas id="map-canvas"></canvas>
    <canvas id="chart-canvas"></canvas>
    <button type="button" id="btn-stop" disabled>Stop Recording</button>
  </div>

  <!-- Handoff -->
  <div id="screen-handoff" class="screen">
    <h2>Path Recorded</h2>
    <p id="handoff-steps">0 steps</p>
    <p class="instruction">Walk back to the starting location, then press Start Finding.</p>
    <button type="button" id="btn-find">Start Finding</button>
  </div>

  <!-- Navigating -->
  <div id="screen-navigating" class="screen">
    <div id="hud-nav">
      <span id="distance-display">-- m to destination</span>
    </div>
    <canvas id="nav-canvas"></canvas>
  </div>

  <script>
    // ── Constants ──────────────────────────────────────────────────────
    const STEP_LENGTH        = 0.75;  // meters per step
    const ARRIVAL_DISTANCE_M = 3.0;   // meters — triggers "You're close!"

    // Adaptive step detector — works on detrended signal (mag minus EMA baseline)
    const EMA_ALPHA          = 0.05;  // EMA smoothing — slow enough to not track carpet steps
    const STEP_PEAK_G        = 0.10;  // detrended peak must exceed this to arm
    const STEP_VALLEY_G      = 0.02;  // detrended must fall below this to fire
    const STEP_COOLDOWN_MS   = 350;   // minimum ms between steps
    const STEP_DISARM_MS     = 2000;  // disarm if peak not followed by valley within this
    const PATH_LOOKAHEAD_M   = 5.0;   // meters to look ahead along recorded path for finder arrow

    // ── State ──────────────────────────────────────────────────────────
    let appMode  = 'welcome';    // 'welcome' | 'recording' | 'navigating'
    let recordedPath = [];       // [{x, y}] meters from origin
    let currentPos   = {x:0, y:0};
    let compassHeading = 0;      // degrees, 0=North, clockwise
    let stepCount = 0;
    let ema = 1.0;               // EMA baseline (starts at 1g = gravity at rest)
    let stepArmed = false;       // true after detrended crosses STEP_PEAK_G
    let stepArmedTime = 0;       // timestamp when armed, for disarm timeout
    let lastStepTime = 0;
    const magHistory = [];       // rolling detrended readings for chart
    const MAG_HISTORY_LEN = 300;

    // ── DOM refs ───────────────────────────────────────────────────────
    const mapCanvas   = document.getElementById('map-canvas');
    const navCanvas   = document.getElementById('nav-canvas');
    const chartCanvas = document.getElementById('chart-canvas');
    const mapCtx      = mapCanvas.getContext('2d');
    const navCtx      = navCanvas.getContext('2d');
    const chartCtx    = chartCanvas.getContext('2d');

    // ── Screen switching ───────────────────────────────────────────────
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      appMode = id.replace('screen-', '');
      if (id === 'screen-recording') {
        setTimeout(() => resizeCanvas(mapCanvas), 50);
        requestAnimationFrame(drawRecording);
      }
      if (id === 'screen-navigating') {
        setTimeout(() => resizeCanvas(navCanvas), 50);
        requestAnimationFrame(drawNavMap);
      }
    }

    // ── Button wiring ──────────────────────────────────────────────────
    document.getElementById('btn-start').addEventListener('click', onStartRecording);
    document.getElementById('btn-stop').addEventListener('click', onStopRecording);
    document.getElementById('btn-find').addEventListener('click', onStartFinding);

    async function onStartRecording() {
      if (typeof DeviceMotionEvent === 'undefined') {
        document.getElementById('sensor-error').style.display = 'block';
        return;
      }
      try {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
          const mp = await DeviceMotionEvent.requestPermission();
          if (mp !== 'granted') { alert('Motion access required — reload and allow.'); return; }
        }
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          const op = await DeviceOrientationEvent.requestPermission();
          if (op !== 'granted') { alert('Orientation access required — reload and allow.'); return; }
        }
      } catch (e) {
        document.getElementById('sensor-error').style.display = 'block';
        return;
      }
      window.addEventListener('deviceorientation', onOrientation, true);
      window.addEventListener('devicemotion',      onMotion,      true);
      resetRecording();
      showScreen('screen-recording');
    }

    function onStopRecording() {
      document.getElementById('handoff-steps').textContent = stepCount + ' steps recorded';
      showScreen('screen-handoff');
    }

    function onStartFinding() {
      currentPos = {x:0, y:0};   // Person B starts from origin
      ema = 1.0;
      stepArmed = false;
      stepArmedTime = 0;
      lastStepTime = 0;
      magHistory.length = 0;
      showScreen('screen-navigating');
    }

    function resetRecording() {
      recordedPath = [{x:0, y:0}];
      currentPos   = {x:0, y:0};
      stepCount    = 0;
      ema          = 1.0;
      stepArmed    = false;
      stepArmedTime = 0;
      lastStepTime = 0;
      magHistory.length = 0;
      document.getElementById('step-count').textContent = '0 steps';
      document.getElementById('btn-stop').disabled = false;
    }

    function onOrientation(e) {
      // webkitCompassHeading: 0=North, increases clockwise (iOS only)
      // alpha fallback: degrees from North, counter-clockwise — invert it
      if (e.webkitCompassHeading != null) {
        compassHeading = e.webkitCompassHeading;
      } else if (e.alpha != null) {
        compassHeading = (360 - e.alpha) % 360;
      }
    }

    function onMotion(e) {
      const a = e.accelerationIncludingGravity;
      if (!a) return;
      const mag = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z) / 9.80665; // m/s² → g

      // Update adaptive baseline via EMA
      ema = EMA_ALPHA * mag + (1 - EMA_ALPHA) * ema;
      const detrended = mag - ema;

      // Chart shows detrended signal — maps directly to what the detector sees
      magHistory.push(detrended);
      if (magHistory.length > MAG_HISTORY_LEN) magHistory.shift();

      document.getElementById('debug-mag').textContent = detrended.toFixed(2) + 'g';

      const now = Date.now();

      // Disarm if the peak was too long ago (person stopped mid-stride)
      if (stepArmed && (now - stepArmedTime) > STEP_DISARM_MS) {
        stepArmed = false;
      }

      if (!stepArmed && detrended > STEP_PEAK_G) {
        // Rising edge: detrended crossed above peak threshold — arm the detector
        stepArmed = true;
        stepArmedTime = now;
      } else if (stepArmed && detrended < STEP_VALLEY_G) {
        // Falling edge: returned to baseline — one step has completed
        stepArmed = false;
        if (now - lastStepTime >= STEP_COOLDOWN_MS) {
          lastStepTime = now;
          recordStep();
        }
      }
    }

    function recordStep() {
      const hr = compassHeading * Math.PI / 180;
      currentPos = {
        x: currentPos.x + STEP_LENGTH * Math.sin(hr),
        y: currentPos.y + STEP_LENGTH * Math.cos(hr),
      };
      if (appMode === 'recording') {
        recordedPath.push({...currentPos});
        stepCount++;
        document.getElementById('step-count').textContent = stepCount + ' steps';
      }
    }

    function resizeCanvas(canvas) {
      canvas.width  = canvas.offsetWidth  * window.devicePixelRatio;
      canvas.height = canvas.offsetHeight * window.devicePixelRatio;
    }

    window.addEventListener('resize', () => {
      resizeCanvas(mapCanvas);
      resizeCanvas(navCanvas);
    });

    // Auto-scale path to fill canvas with padding
    function buildTransform(canvas, path, padding) {
      padding = padding || 80;
      if (path.length < 2) {
        const scale = Math.min(canvas.width, canvas.height) / 20;
        return { cx: canvas.width / 2, cy: canvas.height / 2, scale };
      }
      const xs = path.map(p => p.x), ys = path.map(p => p.y);
      const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
      const minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
      const rangeX = maxX - minX || 1, rangeY = maxY - minY || 1;
      const scale = Math.min(
        (canvas.width  - padding * 2) / rangeX,
        (canvas.height - padding * 2) / rangeY
      );
      return {
        cx: canvas.width  / 2 - ((minX + maxX) / 2) * scale,
        cy: canvas.height / 2 + ((minY + maxY) / 2) * scale,
        scale,
      };
    }

    // World coords (meters) → canvas pixels. Y-axis: canvas down = world south.
    function worldToCanvas(t, p) {
      return { cx: t.cx + p.x * t.scale, cy: t.cy - p.y * t.scale };
    }

    function drawGrid(ctx, canvas, t) {
      const step = Math.max(t.scale * 5, 30);
      ctx.strokeStyle = '#1a1a2e';
      ctx.lineWidth = 1;
      for (let x = ((t.cx % step) + step) % step; x < canvas.width;  x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = ((t.cy % step) + step) % step; y < canvas.height; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
    }

    function drawGlowingPath(ctx, t, path, alpha) {
      alpha = alpha == null ? 1.0 : alpha;
      if (path.length < 2) return;
      const pts = path.map(function(p) { return worldToCanvas(t, p); });
      // Glow pass
      ctx.save();
      ctx.globalAlpha = 0.25 * alpha;
      ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 10;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(pts[0].cx, pts[0].cy);
      pts.slice(1).forEach(function(p) { ctx.lineTo(p.cx, p.cy); });
      ctx.stroke();
      // Core pass
      ctx.globalAlpha = alpha;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(pts[0].cx, pts[0].cy);
      pts.slice(1).forEach(function(p) { ctx.lineTo(p.cx, p.cy); });
      ctx.stroke();
      ctx.restore();
    }

    function drawDot(ctx, t, pos, color, r) {
      r = r || 8;
      const pt = worldToCanvas(t, pos);
      ctx.beginPath(); ctx.arc(pt.cx, pt.cy, r, 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();
    }

    function drawCompassRose(ctx) {
      var x = 44, y = 44, r = 22;
      ctx.save(); ctx.globalAlpha = 0.65;
      ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#00e5ff';
      ctx.font = 'bold ' + Math.round(r * 0.6) + 'px -apple-system';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('N', x, y - r * 0.45);
      ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(x, y - r + 5); ctx.lineTo(x, y); ctx.stroke();
      ctx.restore();
    }

    function drawMagChart() {
      var dpr = window.devicePixelRatio || 1;
      var w = chartCanvas.offsetWidth, h = chartCanvas.offsetHeight;
      if (chartCanvas.width !== w * dpr || chartCanvas.height !== h * dpr) {
        chartCanvas.width  = w * dpr;
        chartCanvas.height = h * dpr;
        chartCtx.scale(dpr, dpr);
      }
      chartCtx.clearRect(0, 0, w, h);

      if (magHistory.length < 2) return;

      // Y range: detrended signal, centered on zero (±0.5g range)
      var yMin = -0.5, yMax = 0.5;
      var toY = function(v) { return h - ((v - yMin) / (yMax - yMin)) * h; };

      // Zero line
      chartCtx.save();
      chartCtx.strokeStyle = '#333';
      chartCtx.lineWidth = 1;
      chartCtx.beginPath();
      chartCtx.moveTo(0, toY(0)); chartCtx.lineTo(w, toY(0));
      chartCtx.stroke();

      // Threshold lines
      chartCtx.setLineDash([4, 3]);
      chartCtx.strokeStyle = '#ff5252';
      chartCtx.beginPath();
      chartCtx.moveTo(0, toY(STEP_PEAK_G)); chartCtx.lineTo(w, toY(STEP_PEAK_G));
      chartCtx.stroke();
      chartCtx.strokeStyle = '#ffab40';
      chartCtx.beginPath();
      chartCtx.moveTo(0, toY(STEP_VALLEY_G)); chartCtx.lineTo(w, toY(STEP_VALLEY_G));
      chartCtx.stroke();
      chartCtx.setLineDash([]);
      chartCtx.restore();

      // Threshold labels (tiny)
      chartCtx.save();
      chartCtx.font = '8px -apple-system';
      chartCtx.fillStyle = '#ff5252';
      chartCtx.fillText('arm ' + STEP_PEAK_G + 'g', 2, toY(STEP_PEAK_G) - 2);
      chartCtx.fillStyle = '#ffab40';
      chartCtx.fillText('fire ' + STEP_VALLEY_G + 'g', 2, toY(STEP_VALLEY_G) - 2);
      chartCtx.restore();

      // Magnitude line
      var len = magHistory.length;
      chartCtx.save();
      chartCtx.strokeStyle = '#00e5ff';
      chartCtx.lineWidth = 1.5;
      chartCtx.lineJoin = 'round';
      chartCtx.beginPath();
      for (var i = 0; i < len; i++) {
        var x = (i / (MAG_HISTORY_LEN - 1)) * w;
        var y = toY(magHistory[i]);
        if (i === 0) chartCtx.moveTo(x, y); else chartCtx.lineTo(x, y);
      }
      chartCtx.stroke();
      chartCtx.restore();
    }

    // ── Draw loops ──────────────────────────────────────────────────────────
    function drawRecording() {
      if (appMode !== 'recording') return;
      if (mapCanvas.width === 0 || mapCanvas.height === 0) { requestAnimationFrame(drawRecording); return; }
      mapCtx.clearRect(0, 0, mapCanvas.width, mapCanvas.height);
      var path = recordedPath.concat([currentPos]);
      var t = buildTransform(mapCanvas, path);
      drawGrid(mapCtx, mapCanvas, t);
      drawGlowingPath(mapCtx, t, path);
      drawDot(mapCtx, t, {x:0, y:0}, '#69f0ae', 8);   // start — green
      drawDot(mapCtx, t, currentPos,  '#ffffff', 6);   // current — white
      drawCompassRose(mapCtx);
      drawMagChart();
      requestAnimationFrame(drawRecording);
    }
    function getDist(a, b) {
      var dx = b.x - a.x, dy = b.y - a.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getBearingDeg(cur, dest, headingDeg) {
      var dx = dest.x - cur.x, dy = dest.y - cur.y;
      var deg = Math.atan2(dx, dy) * 180 / Math.PI;
      return ((deg - headingDeg) + 360) % 360;
    }

    function getDestination() {
      return recordedPath[recordedPath.length - 1] || {x:0, y:0};
    }

    // Returns a point PATH_LOOKAHEAD_M ahead of the closest path point to currentPos.
    // This makes the finder arrow guide along the path rather than cutting straight to the end.
    function getPathTarget() {
      if (recordedPath.length < 2) return getDestination();

      // Find the closest recorded path point to our current position
      var closestIdx = 0, closestDist = Infinity;
      for (var i = 0; i < recordedPath.length; i++) {
        var d = getDist(currentPos, recordedPath[i]);
        if (d < closestDist) { closestDist = d; closestIdx = i; }
      }

      // Walk forward along path segments until PATH_LOOKAHEAD_M is accumulated
      var accumulated = 0, targetIdx = closestIdx;
      for (var i = closestIdx; i < recordedPath.length - 1; i++) {
        accumulated += getDist(recordedPath[i], recordedPath[i + 1]);
        targetIdx = i + 1;
        if (accumulated >= PATH_LOOKAHEAD_M) break;
      }

      return recordedPath[targetIdx];
    }

    // Draws an arrow from (cx, cy) pointing in bearingDeg (clockwise from north).
    function drawArrow(ctx, cx, cy, bearingDeg, length, color) {
      var rad = (bearingDeg - 90) * Math.PI / 180;  // convert bearing to canvas angle
      var ex = cx + Math.cos(rad) * length;
      var ey = cy + Math.sin(rad) * length;
      var headLen = Math.max(10, length * 0.35);
      var headAng = Math.PI / 6;
      ctx.save();
      ctx.strokeStyle = color; ctx.fillStyle = color;
      ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(ex - headLen * Math.cos(rad - headAng), ey - headLen * Math.sin(rad - headAng));
      ctx.lineTo(ex - headLen * Math.cos(rad + headAng), ey - headLen * Math.sin(rad + headAng));
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    function drawNavMap() {
      if (appMode !== 'navigating') return;
      if (navCanvas.width === 0 || navCanvas.height === 0) { requestAnimationFrame(drawNavMap); return; }
      navCtx.clearRect(0, 0, navCanvas.width, navCanvas.height);

      var dest   = getDestination();
      var target = getPathTarget();
      var dist   = getDist(currentPos, dest);
      var allPts = recordedPath.concat([currentPos]);
      var t = buildTransform(navCanvas, allPts);

      drawGrid(navCtx, navCanvas, t);
      drawGlowingPath(navCtx, t, recordedPath, 0.5);  // recorded path, faded
      drawDot(navCtx, t, {x:0, y:0}, '#69f0ae', 8);   // start — green
      drawDot(navCtx, t, dest,        '#ff5252', 8);   // destination — red

      // Two arrows on Person B's position: facing direction + path direction
      var myPt = worldToCanvas(t, currentPos);
      var arrowLen = 42 * (window.devicePixelRatio || 1);

      // Path direction (cyan) — where to go to stay on trail
      var dx = target.x - currentPos.x, dy = target.y - currentPos.y;
      var pathBearing = ((Math.atan2(dx, dy) * 180 / Math.PI) + 360) % 360;
      drawArrow(navCtx, myPt.cx, myPt.cy, pathBearing, arrowLen, '#00e5ff');

      // Facing direction (white) — which way Person B is currently pointing
      drawArrow(navCtx, myPt.cx, myPt.cy, compassHeading, arrowLen * 0.65, '#ffffff');

      drawDot(navCtx, t, currentPos, '#ffffff', 5);   // Person B dot on top
      drawCompassRose(navCtx);

      // Distance HUD
      var label = dist <= ARRIVAL_DISTANCE_M ? "You're close!" : Math.round(dist) + ' m to destination';
      document.getElementById('distance-display').textContent = label;

      requestAnimationFrame(drawNavMap);
    }
  </script>
</body>
</html>
